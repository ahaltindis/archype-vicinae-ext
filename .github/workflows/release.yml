# Pushing a tag like v0.1.0 builds the extension and attaches archype-vicinae-ext-0.1.0.tar.gz
# to a GitHub release; the AUR PKGBUILD downloads that file.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --out dist/archype
      - name: Pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          tarball=archype-vicinae-ext-$version.tar.gz
          tar -czf "$tarball" -C dist archype
          sha256sum "$tarball" > "$tarball.sha256"
          gh release create "$GITHUB_REF_NAME" "$tarball" "$tarball.sha256" --title "$GITHUB_REF_NAME" --generate-notes
